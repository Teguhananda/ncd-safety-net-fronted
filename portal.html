<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BERENDO SEHAT</title>
  <meta name="description" content="BERENDO SEHAT — Dari Berendo Rumah, RS Tetap Menjago" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Manifest PWA Portal Pasien — TERTANAM STATIS di file ini (bukan
       diganti lewat JavaScript seperti percobaan sebelumnya), supaya
       Safari iOS pasti membaca manifest yang benar (scope /portal) saat
       "Add to Home Screen", bukan manifest staff. -->
  <link rel="manifest" href="/manifest-portal.json" />
  <meta name="theme-color" content="#0f6d5c" />

  <!-- Meta khusus iOS Add to Home Screen (Safari tidak selalu baca manifest.json) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BERENDO SEHAT" />
  <!-- PERBAIKAN (Sept 2026): ikon ukuran PAS (dibuat dari app-icon-square.png
       dengan sips). Sebelumnya manifest menyebut 192x192/512x512 padahal
       gambarnya 1024x1024 → Chrome menolak ikon & memakai huruf "N". -->
  <link rel="apple-touch-icon" sizes="180x180" href="/logos/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/logos/icon-192.png" />

  <!-- Cegah "kedip putih" sesaat sebelum CSS/JS termuat penuh — theme-color
       di atas cuma mewarnai status bar, bukan latar halaman itu sendiri. -->
  <style>html, body { background: #f5fafa; margin: 0; padding: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <!-- BARU (21 Okt 2026): bila aplikasi gagal tampil di HP/peramban yang
       terlalu lama, tampilkan petunjuk ramah (bukan layar putih kosong).
       Ditulis dengan JavaScript lama (ES5) supaya tetap jalan di HP lama;
       otomatis hilang begitu aplikasi berhasil tampil. -->
  <script>
    (function () {
      var shown = false;
      function cek() {
        var root = document.getElementById("root");
        var box = document.getElementById("berendo-fallback");
        if (root && root.children.length > 0) { if (box) box.parentNode.removeChild(box); return; }
        if (!shown) {
          shown = true;
          box = document.createElement("div");
          box.id = "berendo-fallback";
          box.setAttribute("style", "font-family:sans-serif;max-width:420px;width:calc(100% - 32px);box-sizing:border-box;margin:40px auto;padding:22px;border-radius:16px;background:#ffffff;border:1px solid #dce5db;color:#203b35;font-size:17px;line-height:1.5");
          box.innerHTML = "<b style='font-size:20px;color:#174f46'>BERENDO SEHAT belum bisa tampil</b>" +
            "<p>Peramban (browser) di HP ini kemungkinan terlalu lama.</p>" +
            "<ol style='padding-left:20px'><li>Android: perbarui <b>Chrome</b> lewat Play Store. iPhone: perbarui iOS lewat Pengaturan.</li>" +
            "<li>Atau pasang dan buka link ini di <b>Firefox</b>.</li>" +
            "<li>Pastikan tanggal &amp; jam HP sudah benar.</li></ol>" +
            "<p>Bila masih gagal, tunjukkan layar ini ke petugas RSUD Kab. Rejang Lebong.</p>";
          document.body.appendChild(box);
        }
        setTimeout(cek, 2000);
      }
      setTimeout(cek, 20000);
    })();
  </script>
  <script type="module" src="/src/portal-main.jsx"></script>
</body>
</html>
