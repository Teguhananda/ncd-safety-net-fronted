<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My NCD Safety</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Manifest PWA Portal Pasien — TERTANAM STATIS di file ini (bukan
       diganti lewat JavaScript seperti percobaan sebelumnya), supaya
       Safari iOS pasti membaca manifest yang benar (scope /portal) saat
       "Add to Home Screen", bukan manifest staff. -->
  <link rel="manifest" href="/manifest-portal.json" />
  <meta name="theme-color" content="#0f6d5c" />

  <!-- Meta khusus iOS Add to Home Screen (Safari tidak selalu baca manifest.json) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My NCD Safety" />
  <link rel="apple-touch-icon" href="/logos/app-logo.png" />

  <!-- Cegah "kedip putih" sesaat sebelum CSS/JS termuat penuh — theme-color
       di atas cuma mewarnai status bar, bukan latar halaman itu sendiri. -->
  <style>html, body { background: #060a16; margin: 0; padding: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/portal-main.jsx"></script>
</body>
</html>
